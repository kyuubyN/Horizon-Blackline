<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Horizon Blackline</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0a1012;color:#ecf1ee}body{margin:0}main{max-width:980px;margin:auto;padding:72px 24px}.eyebrow{color:#79d8ad;letter-spacing:.14em;font-size:.75rem;font-weight:700}h1{font-size:clamp(2.4rem,7vw,5.4rem);line-height:.95;max-width:800px;margin:12px 0 20px}header>p:last-child,article p,.hint{color:#aebcb7;line-height:1.5}.status,.freeze{display:flex;gap:12px;align-items:center;margin:22px 0;padding:14px 16px;background:#13201c;border:1px solid #285641;border-radius:8px}.dot{width:10px;height:10px;border-radius:99px;background:#79d8ad;box-shadow:0 0 18px #79d8ad}.status span:last-child{margin-left:auto;color:#aebcb7}.freeze button{margin:0 0 0 auto;background:#e8b66d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article,.timeline{border:1px solid #273531;background:#101817;padding:22px;border-radius:8px}h2{margin-top:0}.timeline{margin-top:16px}ol,.bdrs{display:flex;flex-wrap:wrap;gap:12px;padding:0;list-style:none}.bdrs li{display:flex;gap:10px;align-items:center}.bdrs code{color:#c7ead8;font-size:.75rem}li{border:1px solid #37554a;padding:7px 10px;border-radius:999px;font-size:.8rem}button{margin-top:12px;padding:10px 14px;border:0;border-radius:6px;background:#79d8ad;color:#07110d;font-weight:700;cursor:pointer}.bdr-button{margin:0;padding:5px 7px;background:#13201c;color:#c7ead8;border:1px solid #37554a}</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>
